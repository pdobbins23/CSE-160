<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>asg0 Vector Drawer</title>
  </head>

  <body onload="main()">
    <canvas id="example" width="400" height="400">
      Please use a browser that supports "canvas"
    </canvas>
    <div>
      <label for="v1x">v1 x:</label>
      <input id="v1x" type="number" step="any" value="1" />
      <label for="v1y">v1 y:</label>
      <input id="v1y" type="number" step="any" value="1" />
    </div>
    <div>
      <label for="v2x">v2 x:</label>
      <input id="v2x" type="number" step="any" value="1" />
      <label for="v2y">v2 y:</label>
      <input id="v2y" type="number" step="any" value="0" />
      <input type="button" value="Draw" onclick="handleDrawEvent()" />
    </div>
    <div>
      <label for="operation">Operation:</label>
      <select id="operation">
        <option value="add">Add</option>
        <option value="sub">Sub</option>
        <option value="mul">Mul</option>
        <option value="div">Div</option>
        <option value="magnitude">Magnitude</option>
        <option value="normalize">Normalize</option>
        <option value="angle between">Angle between</option>
        <option value="area">Area</option>
      </select>
      <label for="scalar">Scalar:</label>
      <input id="scalar" type="number" step="any" value="2" />
      <input
        type="button"
        value="Draw Operation"
        onclick="handleDrawOperationEvent()"
      />
    </div>
    <script src="lib/cuon-matrix-cse160.js"></script>
    <script src="asgn0.js"></script>
  </body>
</html>
