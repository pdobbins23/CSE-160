<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Assignment 1 - Painting</title>
  </head>

  <body>
    <canvas id="webgl" width="400" height="400">
      Please use a browser that supports "canvas"
    </canvas>
    <img src="cat_drawing.jpg" alt="Hand-drawn cat reference" height="400">

    <div>
      <h3>Shape</h3>
      <button id="btnPoint" onclick="setShapeType('point')">Point</button>
      <button id="btnTriangle" onclick="setShapeType('triangle')">Triangle</button>
      <button id="btnCircle" onclick="setShapeType('circle')">Circle</button>

      <h3>Color</h3>
      <label>Red: <span id="redVal">1.0</span></label>
      <input type="range" id="redSlider" min="0" max="1" step="0.01" value="1" oninput="updateColorDisplay()">
      <label>Green: <span id="greenVal">0.0</span></label>
      <input type="range" id="greenSlider" min="0" max="1" step="0.01" value="0" oninput="updateColorDisplay()">
      <label>Blue: <span id="blueVal">0.0</span></label>
      <input type="range" id="blueSlider" min="0" max="1" step="0.01" value="0" oninput="updateColorDisplay()">
      <label>Alpha: <span id="alphaVal">1.0</span></label>
      <input type="range" id="alphaSlider" min="0" max="1" step="0.01" value="1" oninput="updateColorDisplay()">

      <h3>Size</h3>
      <label>Shape Size: <span id="sizeVal">10</span></label>
      <input type="range" id="sizeSlider" min="1" max="60" step="1" value="10" oninput="document.getElementById('sizeVal').innerText=this.value">

      <h3>Circle Segments</h3>
      <label>Segments: <span id="segVal">12</span></label>
      <input type="range" id="segSlider" min="3" max="64" step="1" value="12" oninput="document.getElementById('segVal').innerText=this.value">

      <h3>Actions</h3>
      <button onclick="clearCanvas()">Clear Canvas</button>
      <button onclick="undoShape()">Undo</button>
      <button onclick="drawPicture()">Draw Picture</button>

      <h3>Awesomeness</h3>
      <button id="btnRainbow" onclick="toggleRainbow()">Rainbow Mode</button>
      <button id="btnSpray" onclick="toggleSpray()">Spray Paint</button>

      <div id="performanceDisplay"></div>
    </div>

    <script src="Point.js"></script>
    <script src="Triangle.js"></script>
    <script src="Circle.js"></script>
    <script src="asgn1.js"></script>
  </body>
</html>
